<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover:允许页面铺到刘海屏/底部安全区,配合 CSS env() 使用 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050f1f" />
  <!-- 避免移动浏览器把数字串自动识别成电话号码加链接 -->
  <meta name="format-detection" content="telephone=no, email=no, address=no" />

  <!-- 安全相关 meta -->
  <!-- 严格 CSP:禁内联脚本/样式;只允许本页目录下的资源 + data: 图片(预留) -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none';
                 style-src 'self';
                 script-src 'self';
                 img-src 'self' data:;
                 font-src 'self';
                 connect-src https://api.github.com;
                 base-uri 'none';
                 form-action 'none';
                 frame-ancestors 'none';
                 object-src 'none';" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Permissions-Policy"
        content="camera=(), microphone=(), geolocation=(), payment=(),
                 usb=(), midi=(), accelerometer=(), gyroscope=(),
                 magnetometer=(), display-capture=(), browsing-topics=();" />

  <title>kk — 液态玻璃 / Liquid Glass</title>

  <meta name="twitter:image" content="assets/og.png" />

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="alternate icon" href="data:," />
  <!-- 主题初始化:须在样式表之前执行,避免首帧明暗闪烁 -->

  <link rel="stylesheet" href="assets/style.css?v=10" />
  <!-- IE 专用 fallback:用 flexbox 替 grid、纯色替毛玻璃、移除 min()/env() -->

  <link rel="stylesheet" href="assets/ie.css" />
  <![endif]-->
</head>
<body>
  <a class="skip-link" href="#main-content" data-zh="跳到主要内容" data-en="Skip to main content">跳到主要内容</a>
  <!-- 结构化数据:告诉搜索引擎这是个什么页面 -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "kk",
    "alternateName": "Liquid Glass 2026",
    "url": "https://ZCH-KK.github.io/kk/",
    "description": "液态玻璃风格的双字母动画展示页。",
    "inLanguage": ["zh-CN", "en"],
    "author": {
      "@type": "Person",
      "name": "ZCH-KK",
      "url": "https://github.com/ZCH-KK"
    },
    "publisher": {
      "@type": "Person",
      "name": "ZCH-KK"
    },
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://github.com/ZCH-KK?tab=repositories&q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
  <div class="backdrop" aria-hidden="true">
    <div class="orbit">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
      <div class="blob b4"></div>
    </div>
  </div>

  <main id="main-content" class="stage" role="main">
    <a class="boost"
       href="https://github.com/ZCH-KK/kk"
       target="_blank"
       rel="noopener noreferrer nofollow"
       data-zh="去 GitHub 助力该网页发展"
       data-en="Star on GitHub">
      去 GitHub 助力该网页发展
    </a>
    <p class="stats" aria-live="polite">
      <span class="stats-label" data-zh="已有" data-en=""></span>
      <span class="stars-count" data-zh="…" data-en="…">…</span>
      <span class="stats-suffix" data-zh="人助力" data-en="stars">stars</span>
    </p>
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" class="lang-btn" data-lang="zh" aria-pressed="true">中文</button>
      <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <div class="glass-word">
      <div class="ghost" role="img" aria-label="kk 液态玻璃标题" lang="en">
      <svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="#ffffff" stop-opacity=".60"/>
            <stop offset="38%"  stop-color="#f3f8ff" stop-opacity=".42"/>
            <stop offset="70%"  stop-color="#e8f1fd" stop-opacity=".34"/>
            <stop offset="100%" stop-color="#d6e6fa" stop-opacity=".46"/>
          </linearGradient>

          <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
            <stop offset="28%"  stop-color="#ffffff" stop-opacity="1"/>
            <stop offset="50%"  stop-color="#ffffff" stop-opacity=".4"/>
            <stop offset="75%"  stop-color="#ffffff" stop-opacity=".75"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
          </linearGradient>

          <linearGradient id="edgeLine" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="#ffffff" stop-opacity=".9"/>
            <stop offset="55%"  stop-color="#ffffff" stop-opacity=".35"/>
            <stop offset="100%" stop-color="#cfe3ff" stop-opacity=".55"/>
          </linearGradient>
        </defs>

        <text x="500" y="308" text-anchor="middle" dominant-baseline="central"
              font-family="-apple-system, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
              font-weight="700" font-size="330" letter-spacing="-6"
              fill="url(#body)">kk</text>

        <text x="500" y="308" text-anchor="middle" dominant-baseline="central"
              font-family="-apple-system, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
              font-weight="700" font-size="330" letter-spacing="-6"
              fill="none" stroke="url(#edgeLine)" stroke-width="3.4"
              stroke-linejoin="round" stroke-linecap="round"
              opacity=".95">kk</text>

        <text x="500" y="308" text-anchor="middle" dominant-baseline="central"
              font-family="-apple-system, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
              font-weight="700" font-size="330" letter-spacing="-6"
              fill="none" stroke="url(#rimGrad)" stroke-width="2.8"
              stroke-linejoin="round" stroke-linecap="round"
              opacity=".95">kk</text>
      </svg>
    </div>
  </div>
  <p class="subtitle" data-zh="@ZCH-KK 的个人主页" data-en="ZCH-KK's personal playground">@ZCH-KK 的个人主页</p>
  <button type="button" class="theme-btn" id="theme-toggle"
          aria-label="切换到亮色模式" aria-pressed="false"
          title="切换到亮色模式">
    <span class="theme-icon theme-sun" aria-hidden="true">☀</span>
    <span class="theme-icon theme-moon" aria-hidden="true">☾</span>
  </button>
  </main>

  <aside class="tools-rail" aria-label="子站导航">
    <a class="tools-btn"
       href="https://mcjs.link/"
       target="_blank"
       rel="noopener noreferrer nofollow"
       title="休闲一下 / MCJS"
       data-zh="休闲一下 →"
       data-en="Play MCJS →">
      <span class="tools-glyph" aria-hidden="true">▶</span>
      <span class="tools-label">休闲一下 →</span>
    </a>
    <a class="tools-btn"
       href="https://zch-kk.github.io/kk-tools/"
       target="_blank"
       rel="noopener noreferrer"
       title="进入工具箱 / Open Tools"
       data-zh="进入工具箱 →"
       data-en="Open Tools →">
      <span class="tools-glyph" aria-hidden="true">⚙</span>
      <span class="tools-label">进入工具箱 →</span>
    </a>
    <button type="button" class="tools-btn" id="game-open"
            title="捞流光 · 接住光球 / Catch the Glow"
            aria-label="捞流光 · 接住光球 / Catch the Glow">
      <span class="tools-glyph" aria-hidden="true">✦</span>
      <span class="tools-label" data-zh="小游戏" data-en="Game">小游戏</span>
    </button>
  </aside>

  <footer class="site-foot" role="contentinfo">
    <small class="foot-line" data-zh="© 2026 ZCH-KK · MIT" data-en="© 2026 ZCH-KK · MIT">© 2026 ZCH-KK · MIT</small>
  </footer>

  <!-- ===== 小游戏「捞流光」浮层(液态玻璃卡片,canvas 无外链) ===== -->
  <div class="game-shell" id="game-shell" hidden
       role="dialog" aria-modal="true"
       aria-label="捞流光 · Catch the Glow">
    <div class="game-panel">
      <div class="game-hud">
        <span class="game-title">
          <span class="glow-ico" aria-hidden="true"></span>
          <span data-zh="捞流光" data-en="Catch the Glow">捞流光</span>
        </span>
        <span class="game-hearts" id="game-hearts" aria-label="lives">
          <i class="h on" aria-hidden="true">♥</i><i class="h on" aria-hidden="true">♥</i><i class="h on" aria-hidden="true">♥</i>
        </span>
        <span class="game-score" id="game-score-n" aria-label="score">0</span>
        <button type="button" class="game-hud-btn" id="game-snd"
                aria-label="音效开 / Sound on" title="音效开 / Sound on">🔊</button>
        <button type="button" class="game-hud-btn" id="game-close"
                aria-label="关闭游戏 / Close game" title="Esc">✕</button>
      </div>
      <div class="game-stage">
        <canvas class="game-canvas" id="game-canvas"></canvas>

        <!-- 开场封面 -->
        <div class="game-cover" id="game-cover">
          <p class="game-cover-tip"
             data-zh="移动鼠标或手指,让玻璃碗接住坠落的光球:彩球 +1 · 金球 +5 · 暗刺球千万别接!漏一颗球扣 1 颗心,共 3 颗心。"
             data-en="Move your mouse or finger to catch falling orbs with the glass bowl: orbs +1 · golden +5 · dodge the spiky dark ones! Each miss costs one heart — you have 3."></p>
          <button type="button" class="game-btn game-btn-primary" id="game-start"
                  data-zh="开始" data-en="Start">开始</button>
        </div>

        <!-- 结算 -->
        <div class="game-cover" id="game-result" hidden>
          <p class="game-cover-title" data-zh="流光散去啦" data-en="Glow's gone">流光散去啦</p>
          <p class="game-result-line" id="result-score"></p>
          <p class="game-newbest" id="result-best" hidden></p>
          <div class="game-btns">
            <button type="button" class="game-btn game-btn-primary" id="game-again"
                    data-zh="再来一局" data-en="Play again">再来一局</button>
            <button type="button" class="game-btn game-btn-ghost" id="game-exit"
                    data-zh="退出" data-en="Exit">退出</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/main.js?v=13" defer></script>
